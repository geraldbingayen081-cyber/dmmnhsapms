    <!-- Branch 4: Profile & Password -->
    <path d="M 615 675 L 780 675 L 780 730" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="785" y="715" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0369a1">4. Profile Settings</text>

    <g filter="url(#shadow)">
        <polygon points="705,730 865,730 835,780 675,780" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
        <text x="770" y="752" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">INPUT: New Password</text>
        <text x="770" y="766" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" fill="#b45309" text-anchor="middle">&amp; Personal Info Update</text>
    </g>
    <path d="M 770 780 L 770 815" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

    <g filter="url(#shadow)">
        <rect x="690" y="815" width="160" height="50" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
        <text x="770" y="836" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1e293b" text-anchor="middle">Validate Password Match</text>
        <text x="770" y="850" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">&amp; Save Encrypted to DB</text>
    </g>
    <path d="M 770 865 L 770 900" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

    <g filter="url(#shadow)">
        <polygon points="705,900 845,900 830,945 690,945" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
        <text x="767" y="920" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">OUTPUT: Confirmation</text>
        <text x="767" y="934" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" fill="#b45309" text-anchor="middle">'Password Updated'</text>
    </g>

    <!-- Return Bus -->
    <path d="M 130 1061 L 130 1090 L 480 1090" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <path d="M 370 865 L 370 1090" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <path d="M 560 780 L 560 1090" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <path d="M 767 945 L 767 1090 L 480 1090" stroke="#64748b" stroke-width="1.5" fill="none"/>

    <path d="M 480 1090 L 480 1120" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- DECISION: ANOTHER TASK? (Diamond) -->
    <g filter="url(#shadow)">
        <polygon points="480,1120 605,1165 480,1210 355,1165" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
        <text x="480" y="1160" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Continue Viewing</text>
        <text x="480" y="1175" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Student Portal?</text>
    </g>

    <path d="M 355 1165 L 15 1165 L 15 575 L 260 575" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="230" y="1155" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#16a34a">Yes (Return to Dashboard)</text>

    <path d="M 480 1210 L 480 1250" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="490" y="1230" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">No</text>

    <!-- PROCESS LOGOUT (Rectangle) -->
    <g filter="url(#shadow)">
        <rect x="370" y="1250" width="220" height="42" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="480" y="1275" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Clear Student Session</text>
    </g>

    <path d="M 480 1292 L 480 1330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- OUTPUT LOGOUT (Parallelogram) -->
    <g filter="url(#shadow)">
        <polygon points="360,1330 610,1330 580,1370 330,1370" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
        <text x="470" y="1353" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">OUTPUT: Redirect to Login Page</text>
    </g>

    <path d="M 470 1370 L 470 1395" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- END (Oval) -->
    <g filter="url(#shadow)">
        <rect x="380" y="1395" width="180" height="24" rx="12" ry="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <text x="470" y="1411" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">END: Session Terminated</text>
    </g>
</svg>
