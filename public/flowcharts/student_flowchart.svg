    </g>

    <!-- Published = NO -->
    <path d="M 60 855 L 20 855 L 20 560 L 260 560" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
    <text x="25" y="845" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#e11d48">No (Pending)</text>

    <!-- Published = YES -->
    <path d="M 140 895 L 140 930" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
    <text x="150" y="915" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#16a34a">Yes</text>

