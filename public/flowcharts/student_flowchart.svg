        <text x="130" y="966" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">&amp; Performance Remarks</text>
    </g>
    <path d="M 130 980 L 130 1015" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

