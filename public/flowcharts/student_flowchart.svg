<svg width="980" height="1420" viewBox="0 0 980 1420" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
    </defs>

    <rect width="980" height="1420" fill="#ffffff"/>

    <text x="490" y="38" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">STUDENT USER FLOWCHART</text>
    <text x="490" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Academic Performance Monitoring System with Analytics</text>

    <!-- START (Oval) -->
    <g filter="url(#shadow)">
        <rect x="400" y="80" width="180" height="46" rx="23" ry="23" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <text x="490" y="108" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">START: Access Portal</text>
    </g>

    <path d="M 490 126 L 490 160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- INPUT LRN (Parallelogram) -->
    <g filter="url(#shadow)">
        <polygon points="370,160 630,160 590,210 330,210" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
        <text x="480" y="185" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">INPUT: Student LRN &amp; Password</text>
        <text x="480" y="200" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">(Submit Learner Login)</text>
    </g>

    <path d="M 480 210 L 480 245" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- PROCESS AUTH (Rectangle) -->
    <g filter="url(#shadow)">
        <rect x="360" y="245" width="240" height="46" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="480" y="268" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Verify Student LRN &amp; Enrollment</text>
        <text x="480" y="282" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Check Active School Year Roster</text>
    </g>

    <path d="M 480 291 L 480 325" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- DECISION AUTH (Diamond) -->
    <g filter="url(#shadow)">
        <polygon points="480,325 610,370 480,415 350,370" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
        <text x="480" y="367" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Are Credentials</text>
        <text x="480" y="381" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Valid &amp; Enrolled?</text>
    </g>

    <!-- NO -->
    <path d="M 610 370 L 760 370 L 760 300" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="645" y="362" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e11d48">No</text>

    <!-- Error notice (Parallelogram) -->
    <g filter="url(#shadow)">
        <polygon points="665,250 865,250 835,298 635,298" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
        <text x="750" y="272" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">OUTPUT: Error Notice</text>
        <text x="750" y="286" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#be123c" text-anchor="middle">'Invalid LRN or Password'</text>
    </g>
    <path d="M 750 250 L 750 185 L 635 185" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- YES -->
    <path d="M 480 415 L 480 455" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="490" y="438" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#16a34a">Yes</text>

    <!-- PROCESS SESSION (Rectangle) -->
    <g filter="url(#shadow)">
        <rect x="350" y="455" width="260" height="42" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="480" y="480" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Retrieve Student Academic Records</text>
    </g>

    <path d="M 480 497 L 480 530" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- OUTPUT DASHBOARD (Parallelogram) -->
    <g filter="url(#shadow)">
        <polygon points="300,530 680,530 640,585 260,585" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
        <text x="470" y="553" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">OUTPUT: Display Student Dashboard</text>
        <text x="470" y="569" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">General Average, Current Quarter Marks, Subject Breakdown Chart &amp; Honors Status</text>
    </g>

    <path d="M 470 585 L 470 625" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- DECISION: FEATURE MENU (Diamond) -->
    <g filter="url(#shadow)">
        <polygon points="470,625 615,675 470,725 325,675" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
        <text x="470" y="670" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Select Student</text>
        <text x="470" y="685" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Feature / Tab?</text>
    </g>

    <!-- Branch 1: View Grades & Download SF9 -->
    <path d="M 325 675 L 150 675 L 150 730" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="155" y="715" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0369a1">1. View Grades</text>

