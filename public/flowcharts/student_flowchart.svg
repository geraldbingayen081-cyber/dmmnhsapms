    <g filter="url(#shadow)">
        <polygon points="75,730 235,730 205,780 45,780" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
        <text x="140" y="752" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">INPUT: Select Target</text>
        <text x="140" y="766" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">School Year &amp; Quarter</text>
    </g>
    <path d="M 140 780 L 140 815" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

    <!-- Check Published (Diamond) -->
    <g filter="url(#shadow)">
        <polygon points="140,815 220,855 140,895 60,855" fill="#fae8ff" stroke="#a855f7" stroke-width="1.5"/>
        <text x="140" y="852" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#6b21a8" text-anchor="middle">Are Grades</text>
